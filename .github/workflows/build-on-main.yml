name: Builds On Main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    # 21 for the 1.21.x targets, 25 for 26.x and for Gradle itself (listed last = default JAVA_HOME)
    - name: Set up JDKs
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: |
          21
          25
        cache: 'gradle'
    - name: Grant execute permission to gradlew
      run: chmod +x gradlew
    - name: Build all targets
      run: ./gradlew build
    - uses: actions/upload-artifact@v4
      with:
        name: nocc-jars
        path: versions/*/build/libs/*.jar
